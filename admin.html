
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>એડમિન પેનલ | સધી સિકોતર માતાજી ઉદલપુરધામ</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --maroon: #741827;
      --deep: #410c19;
      --gold: #d9ad55;
      --cream: #fff8e9;
      --text: #38251e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f7f0e5;
      color: var(--text);
      font-family: sans-serif;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 18px;
      padding: 22px;
      background: linear-gradient(135deg, var(--deep), var(--maroon));
      color: white;
      border: 2px solid var(--gold);
      border-radius: 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    main { max-width: 1000px; margin: auto; }
    .panel {
      padding: 20px;
      margin-bottom: 18px;
      background: white;
      border: 1px solid #e5d5b5;
      border-radius: 14px;
      box-shadow: 0 5px 18px #00000008;
    }
    h2 { margin-top: 0; color: var(--maroon); }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    input, textarea, select {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbbda8;
      border-radius: 8px;
      background: white;
      color: var(--text);
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      padding: 11px 16px;
      margin: 8px 6px 0 0;
      border: 0;
      border-radius: 8px;
      background: var(--maroon);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #66564c; }
    .danger { background: #a32222; }
    .item {
      padding: 14px 0;
      border-bottom: 1px solid #eadfcd;
      overflow-wrap: anywhere;
    }
    .item:last-child { border-bottom: 0; }
    .item h3 { margin: 0 0 6px; }
    .muted { color: #66564c; font-size: 14px; }
    .status { overflow-wrap: anywhere; line-height: 1.6; }
    .hidden { display: none !important; }
    .media-preview {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #e5d5b5;
      border-radius: 12px;
      background: #fffaf1;
      overflow: hidden;
    }
    .media-preview img,
    .media-preview video,
    .media-preview iframe {
      display: block;
      width: 100%;
      max-width: 560px;
      max-height: 320px;
      border: 0;
      border-radius: 8px;
      object-fit: contain;
      background: #2b2020;
    }
    .media-preview audio { display: block; width: 100%; max-width: 560px; }
    .preview-caption { margin: 0 0 8px; font-size: 13px; color: #66564c; }
    .item-preview { max-width: 260px; margin: 10px 0; }
    .item-preview img, .item-preview video, .item-preview iframe { max-height: 180px; }
    .checkrow { display: flex; align-items: center; gap: 10px; }
    .checkrow input { width: auto; }
    .checkrow label { margin: 14px 0; }
    @media (min-width: 700px) {
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 18px;
      }
      .wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🛕 સધી સિકોતર માતાજી ઉદલપુરધામ</h1>
    <div>વેબસાઇટ મેનેજમેન્ટ પેનલ</div>
  </header>

  <main>
    <section class="panel" id="loginPanel">
      <h2>એડમિન સાઇન ઇન</h2>
      <p>અધિકૃત Google એકાઉન્ટથી સાઇન ઇન કરો.</p>
      <button id="loginBtn" type="button">Googleથી સાઇન ઇન કરો</button>
      <p id="loginStatus" class="status" role="status" aria-live="polite">
        સાઇન ઇન માટે તૈયાર.
      </p>
    </section>

    <div id="dashboard" class="hidden">
      <section class="panel">
        <h2>એડમિન ડેશબોર્ડ</h2>
        <p id="welcome"></p>
        <p class="muted">
          પ્રકાશિત કરેલી સામગ્રી જ જાહેર વેબસાઇટ પર વાંચી શકાય તે રીતે સાચવાશે.
        </p>
        <button id="logoutBtn" class="secondary" type="button">સાઇન આઉટ</button>
      </section>

      <section class="panel">
        <h2 id="formHeading">નવી સામગ્રી ઉમેરો</h2>

        <form id="contentForm">
          <div class="fields">
            <div class="wide">
              <label for="collection">વિભાગ પસંદ કરો</label>
              <select id="collection" required>
                <option value="bhajans">ભજન અને આરતી</option>
                <option value="stories">ધાર્મિક કથાઓ</option>
                <option value="gallery">દર્શન ગેલેરી</option>
                <option value="festivals">પર્વ અને ઉત્સવ</option>
                <option value="videos">લાઇવ દર્શન અને વિડિયો</option>
                <option value="history">ધામનો પરિચય</option>
                <option value="contact">સંપર્ક અને નકશો</option>
              </select>
            </div>

            <div class="wide">
              <label for="title">શીર્ષક *</label>
              <input id="title" maxlength="200" required
                placeholder="સામગ્રીનું શીર્ષક લખો">
            </div>

            <div class="wide">
              <label for="content">વિગતો / લખાણ</label>
              <textarea id="content" maxlength="20000"
                placeholder="સામગ્રીની વિગતો લખો"></textarea>
            </div>

            <div class="wide">
              <label for="imageUrl">ફોટાની લિંક</label>
              <input id="imageUrl" type="url" maxlength="2000"
                placeholder="https://...">
              <label for="photoFile">અહીંથી ફોટો અપલોડ કરો (મહત્તમ 4 MB)</label>
              <input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <button id="uploadPhotoBtn" type="button" class="secondary">ફોટો GitHub માં અપલોડ કરો</button>
              <p id="photoUploadStatus" class="status" role="status" aria-live="polite"></p>
              <div id="imagePreview" class="media-preview hidden" aria-live="polite"></div>
            </div>

            <div class="wide">
              <label for="linkUrl">ભજન / વિડિયો / લાઇવ લિંક</label>
              <input id="linkUrl" type="url" maxlength="2000"
                placeholder="YouTube અથવા અન્ય લિંક">
              <label for="audioFile">અહીંથી ભજન / આરતીની ઓડિયો ફાઇલ અપલોડ કરો (મહત્તમ 4 MB)</label>
              <input id="audioFile" type="file" accept="audio/mpeg,audio/mp4,audio/aac,audio/ogg,audio/wav,audio/x-wav,audio/webm">
              <button id="uploadAudioBtn" type="button" class="secondary">ભજન GitHub માં અપલોડ કરો</button>
              <p id="audioUploadStatus" class="status" role="status" aria-live="polite"></p>
              <div id="linkPreview" class="media-preview hidden" aria-live="polite"></div>
            </div>

            <div>
              <label for="date">તારીખ</label>
              <input id="date" type="date">
            </div>

            <div>
              <label for="location">સ્થળ</label>
              <input id="location" maxlength="300"
                placeholder="મંદિર અથવા કાર્યક્રમનું સ્થળ">
            </div>
          </div>

          <div class="checkrow">
            <input id="published" type="checkbox">
            <label for="published">વેબસાઇટ પર પ્રકાશિત કરો</label>
          </div>

          <button id="saveBtn" type="submit">સામગ્રી સાચવો</button>
          <button id="cancelEditBtn" class="secondary hidden" type="button">
            ફેરફાર રદ કરો
          </button>
          <p id="formStatus" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel">
        <h2>સાચવેલી સામગ્રી</h2>
        <label for="listCollection">કયો વિભાગ જોવો છે?</label>
        <select id="listCollection">
          <option value="bhajans">ભજન અને આરતી</option>
          <option value="stories">ધાર્મિક કથાઓ</option>
          <option value="gallery">દર્શન ગેલેરી</option>
          <option value="festivals">પર્વ અને ઉત્સવ</option>
          <option value="videos">લાઇવ દર્શન અને વિડિયો</option>
          <option value="history">ધામનો પરિચય</option>
          <option value="contact">સંપર્ક અને નકશો</option>
        </select>
        <p id="listStatus" class="status" role="status" aria-live="polite"></p>
        <div id="contentList"></div>
      </section>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAdo3BhBLiBtLp_by35Z_w00lNcALxk72k",
      authDomain: "sadhi-sikotar-udalpur-dham.firebaseapp.com",
      projectId: "sadhi-sikotar-udalpur-dham",
      storageBucket: "sadhi-sikotar-udalpur-dham.firebasestorage.app",
      messagingSenderId: "579984682526",
      appId: "1:579984682526:web:6348d8e57d3381e557080f",
      measurementId: "G-775X1KW7VX"
    };

    const ADMIN_EMAIL = "moral.prem24@gmail.com";
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const $ = id => document.getElementById(id);
    let editingId = null;
    let busy = false;

    function setStatus(id, message) {
      $(id).textContent = message;
    }

    function safeUrl(value) {
      const trimmed = (value || "").trim();
      if (!trimmed) return "";
      try {
        const url = new URL(trimmed);
        return ["https:", "http:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function youtubeEmbedUrl(value) {
      try {
        const url = new URL(value);
        let videoId = "";
        if (url.hostname === "youtu.be" || url.hostname.endsWith(".youtu.be")) {
          videoId = url.pathname.split("/").filter(Boolean)[0] || "";
        } else if (url.hostname.includes("youtube.com")) {
          if (url.pathname === "/watch") videoId = url.searchParams.get("v") || "";
          else if (url.pathname.startsWith("/embed/") || url.pathname.startsWith("/shorts/") || url.pathname.startsWith("/live/")) {
            videoId = url.pathname.split("/").filter(Boolean)[1] || "";
          }
        }
        return /^[a-zA-Z0-9_-]{11}$/.test(videoId)
          ? "https://www.youtube-nocookie.com/embed/" + videoId
          : "";
      } catch {
        return "";
      }
    }

    function renderMediaPreview(container, rawUrl, kind) {
      container.replaceChildren();
      const url = safeUrl(rawUrl);
      if (!url) {
        container.classList.add("hidden");
        return;
      }

      container.classList.remove("hidden");
      const caption = document.createElement("p");
      caption.className = "preview-caption";
      caption.textContent = kind === "image" ? "ફોટો પ્રીવ્યૂ" : "મીડિયા પ્રીવ્યૂ";
      container.appendChild(caption);

      let media;
      if (kind === "image") {
        media = document.createElement("img");
        media.src = url;
        media.alt = "પસંદ કરેલા ફોટાનું પ્રીવ્યૂ";
        media.loading = "lazy";
        media.addEventListener("error", () => {
          container.replaceChildren();
          const message = document.createElement("p");
          message.className = "preview-caption";
          message.textContent = "ફોટો લોડ થયો નથી. લિંક સીધી ઇમેજ ફાઇલની છે કે નહીં તપાસો.";
          container.appendChild(message);
        }, { once: true });
      } else {
        const embedUrl = youtubeEmbedUrl(url);
        if (embedUrl) {
          media = document.createElement("iframe");
          media.src = embedUrl;
          media.title = "YouTube વિડિયો પ્રીવ્યૂ";
          media.loading = "lazy";
          media.referrerPolicy = "strict-origin-when-cross-origin";
          media.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          media.allowFullscreen = true;
          media.style.aspectRatio = "16 / 9";
        } else if (/\.(mp3|m4a|ogg|wav|aac)(\?.*)?$/i.test(url)) {
          media = document.createElement("audio");
          media.controls = true;
          media.preload = "none";
          media.src = url;
        } else if (/\.(mp4|webm|ogv|mov)(\?.*)?$/i.test(url)) {
          media = document.createElement("video");
          media.controls = true;
          media.preload = "metadata";
          media.src = url;
        } else {
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "આ લિંક ખોલીને મીડિયા જુઓ";
          container.appendChild(link);
          return;
        }
      }
      container.appendChild(media);
    }

    $("imageUrl").addEventListener("input", () => {
      renderMediaPreview($("imagePreview"), $("imageUrl").value, "image");
    });
    $("linkUrl").addEventListener("input", () => {
      renderMediaPreview($("linkPreview"), $("linkUrl").value, "link");
    });

    const MEDIA_WORKER_URL = "https://sadhi-sikotar-udalpur-dham.moral-prem24.workers.dev";

    async function uploadMediaFile(file, folder, statusId, buttonId) {
      if (busy) return;
      if (!file) {
        setStatus(statusId, "પહેલાં ફાઇલ પસંદ કરો.");
        return;
      }
      if (!auth.currentUser ||
          (auth.currentUser.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        setStatus(statusId, "પહેલાં અધિકૃત એડમિન તરીકે સાઇન ઇન કરો.");
        return;
      }
      const allowed = folder === "photos"
        ? ["image/jpeg", "image/png", "image/webp", "image/gif"]
        : ["audio/mpeg", "audio/mp4", "audio/aac", "audio/ogg", "audio/wav", "audio/x-wav", "audio/webm"];
      if (!allowed.includes(file.type)) {
        setStatus(statusId, "આ ફાઇલનો પ્રકાર માન્ય નથી.");
        return;
      }
      if (file.size > 4 * 1024 * 1024) {
        setStatus(statusId, "ફાઇલ 4 MB કરતાં નાની હોવી જોઈએ.");
        return;
      }
      const extFromName = (file.name.split(".").pop() || "").toLowerCase();
      const allowedExtensions = folder === "photos"
        ? ["jpg", "jpeg", "png", "webp", "gif"]
        : ["mp3", "m4a", "aac", "ogg", "wav", "webm"];
      if (!allowedExtensions.includes(extFromName)) {
        setStatus(statusId, "ફાઇલના નામમાં યોગ્ય extension હોવું જરૂરી છે.");
        return;
      }

      const safeName = file.name.normalize("NFKD")
        .replace(/[^A-Za-z0-9._-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^[.-]+|[.-]+$/g, "")
        .slice(-100);
      const fileName = Date.now() + "-" + (safeName || ("media." + extFromName));
      const targetPath = folder + "/" + fileName;
      const button = $(buttonId);
      button.disabled = true;
      setStatus(statusId, "ફાઇલ અપલોડ થઈ રહી છે... કૃપા કરીને રાહ જુઓ.");

      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("ફાઇલ વાંચી શકાઈ નહીં."));
          reader.readAsDataURL(file);
        });
        const base64 = String(dataUrl).split(",")[1];
        const idToken = await auth.currentUser.getIdToken(true);
        const response = await fetch(MEDIA_WORKER_URL + "/upload", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + idToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ path: targetPath, contentBase64: base64 })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success || !result.url) {
          throw new Error(result.error || "અપલોડ નિષ્ફળ થયું.");
        }

        if (folder === "photos") {
          $("imageUrl").value = result.url;
          renderMediaPreview($("imagePreview"), result.url, "image");
          $("photoFile").value = "";
        } else {
          $("linkUrl").value = result.url;
          renderMediaPreview($("linkPreview"), result.url, "link");
          $("audioFile").value = "";
        }
        setStatus(statusId, "અપલોડ સફળ થયું. હવે 'સામગ્રી સાચવો' દબાવવાથી લિંક વેબસાઇટમાં સાચવાશે.");
      } catch (error) {
        console.error("Media upload failed:", error);
        setStatus(statusId, "અપલોડ નિષ્ફળ થયું. Worker settings, GitHub permission અને ઇન્ટરનેટ તપાસો.");
      } finally {
        button.disabled = false;
      }
    }

    $("uploadPhotoBtn").addEventListener("click", () => {
      uploadMediaFile($("photoFile").files[0], "photos", "photoUploadStatus", "uploadPhotoBtn");
    });
    $("uploadAudioBtn").addEventListener("click", () => {
      uploadMediaFile($("audioFile").files[0], "bhajans", "audioUploadStatus", "uploadAudioBtn");
    });

    function resetForm() {
      const selectedCollection = $("collection").value;
      editingId = null;
      $("contentForm").reset();
      $("collection").value = selectedCollection;
      renderMediaPreview($("imagePreview"), "", "image");
      renderMediaPreview($("linkPreview"), "", "link");
      $("formHeading").textContent = "નવી સામગ્રી ઉમેરો";
      $("saveBtn").textContent = "સામગ્રી સાચવો";
      $("cancelEditBtn").classList.add("hidden");
      setStatus("formStatus", "");
    }

    function setBusy(value) {
      busy = value;
      $("saveBtn").disabled = value;
      $("loginBtn").disabled = value;
      $("logoutBtn").disabled = value;
    }

    $("loginBtn").addEventListener("click", async () => {
      try {
        setStatus("loginStatus", "Google Sign-In ખૂલી રહ્યું છે...");
        await auth.signInWithPopup(provider);
      } catch (error) {
        console.error(error);
        setStatus("loginStatus", "સાઇન-ઇન નિષ્ફળ: " + error.code);
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await auth.signOut();
      } catch (error) {
        console.error(error);
        setStatus("loginStatus", "સાઇન-આઉટ નિષ્ફળ: " + error.code);
      }
    });

    auth.onAuthStateChanged(async user => {
      if (!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        $("dashboard").classList.add("hidden");
        $("loginPanel").classList.remove("hidden");
        if (user) {
          setStatus("loginStatus", "આ એકાઉન્ટને એડમિન પરવાનગી નથી.");
          try { await auth.signOut(); } catch (error) { console.error(error); }
        }
        return;
      }

      $("loginPanel").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      $("welcome").textContent = "સ્વાગત, " + (user.displayName || "એડમિન");
      updateCollectionLabels();
      await loadItems();
    });

    function updateCollectionLabels() {
      const isContact = $("collection").value === "contact";
      $("formHeading").textContent = isContact ? "સંપર્ક અને નકશાની માહિતી" : (editingId ? "સામગ્રીમાં ફેરફાર કરો" : "નવી સામગ્રી ઉમેરો");
      document.querySelector('label[for="title"]').textContent = isContact ? "ફોન નંબર *" : "શીર્ષક *";
      $("title").placeholder = isContact ? "મંદિરનો સંપર્ક નંબર લખો" : "સામગ્રીનું શીર્ષક લખો";
      document.querySelector('label[for="content"]').textContent = isContact ? "મંદિરનું સરનામું" : "વિગતો / લખાણ";
      $("content").placeholder = isContact ? "મંદિરનું પૂરું સરનામું લખો" : "સામગ્રીની વિગતો લખો";
      document.querySelector('label[for="linkUrl"]').textContent = isContact ? "Google Maps લિંક" : "ભજન / વિડિયો / લાઇવ લિંક";
      $("linkUrl").placeholder = isContact ? "મંદિરની Google Maps લિંક" : "YouTube અથવા અન્ય લિંક";
      $("imageUrl").closest(".wide").classList.toggle("hidden", isContact);
      $("date").closest("div").classList.toggle("hidden", isContact);
      $("location").closest("div").classList.toggle("hidden", isContact);
    }

    $("collection").addEventListener("change", () => {
      resetForm();
      updateCollectionLabels();
    });
    $("listCollection").addEventListener("change", loadItems);
    $("cancelEditBtn").addEventListener("click", resetForm);

    $("contentForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (busy || !auth.currentUser ||
          (auth.currentUser.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        setStatus("formStatus", "પહેલાં અધિકૃત એડમિન તરીકે સાઇન ઇન કરો.");
        return;
      }

      const imageUrl = safeUrl($("imageUrl").value);
      const linkUrl = safeUrl($("linkUrl").value);
      if (imageUrl === null || linkUrl === null) {
        setStatus("formStatus", "લિંકમાં ફક્ત માન્ય http અથવા https URL વાપરો.");
        return;
      }

      const data = {
        title: $("title").value.trim(),
        content: $("content").value.trim(),
        imageUrl,
        linkUrl,
        date: $("date").value,
        location: $("location").value.trim(),
        published: $("published").checked,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (!data.title) {
        setStatus("formStatus", "શીર્ષક લખવું જરૂરી છે.");
        return;
      }

      setBusy(true);
      setStatus("formStatus", "સામગ્રી સાચવાઈ રહી છે...");

      try {
        const collectionName = $("collection").value;
        if (editingId) {
          await db.collection(collectionName).doc(editingId).update(data);
          setStatus("formStatus", "સામગ્રીમાં ફેરફાર સાચવાયો.");
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection(collectionName).add(data);
          setStatus("formStatus", "નવી સામગ્રી સફળતાપૂર્વક સાચવાઈ.");
        }

        $("listCollection").value = collectionName;
        resetForm();
        await loadItems();
      } catch (error) {
        console.error(error);
        setStatus("formStatus", "સાચવી શક્યા નહીં: " + error.code +
          ". Firestore Rules અને ઇન્ટરનેટ તપાસો.");
      } finally {
        setBusy(false);
      }
    });

    async function loadItems() {
      const collectionName = $("listCollection").value;
      $("contentList").replaceChildren();
      setStatus("listStatus", "સામગ્રી લોડ થઈ રહી છે...");

      try {
        // Contact records may not have a usable createdAt value on older documents.
        // Load that collection without ordering; keep the existing order for other sections.
        let itemsQuery = db.collection(collectionName);
        if (collectionName !== "contact") {
          itemsQuery = itemsQuery.orderBy("createdAt", "desc");
        }
        const snapshot = await itemsQuery.limit(100).get();

        if (snapshot.empty) {
          setStatus("listStatus", "આ વિભાગમાં હજી કોઈ સામગ્રી નથી.");
          return;
        }

        setStatus("listStatus", snapshot.size + " સામગ્રી બતાવવામાં આવે છે.");

        snapshot.forEach(doc => {
          const item = doc.data();
          const article = document.createElement("article");
          article.className = "item";

          const heading = document.createElement("h3");
          heading.textContent = item.title || "શીર્ષક વગરની સામગ્રી";
          article.appendChild(heading);

          const details = document.createElement("p");
          details.className = "muted";
          details.textContent =
            (item.published ? "પ્રકાશિત" : "પ્રકાશિત નથી") +
            (item.date ? " • તારીખ: " + item.date : "") +
            (item.location ? " • સ્થળ: " + item.location : "");
          article.appendChild(details);

          if (item.content) {
            const body = document.createElement("p");
            body.textContent = item.content.length > 300
              ? item.content.slice(0, 300) + "…" : item.content;
            article.appendChild(body);
          }

          if (item.imageUrl) {
            const preview = document.createElement("div");
            preview.className = "media-preview item-preview";
            renderMediaPreview(preview, item.imageUrl, "image");
            article.appendChild(preview);

            const imageLink = document.createElement("a");
            imageLink.href = item.imageUrl;
            imageLink.target = "_blank";
            imageLink.rel = "noopener noreferrer";
            imageLink.textContent = "ફોટો નવી ટેબમાં ખોલો";
            article.appendChild(imageLink);
          }

          if (item.linkUrl) {
            const preview = document.createElement("div");
            preview.className = "media-preview item-preview";
            renderMediaPreview(preview, item.linkUrl, "link");
            article.appendChild(preview);

            const link = document.createElement("a");
            link.href = item.linkUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "મીડિયા લિંક નવી ટેબમાં ખોલો";
            link.style.display = "block";
            article.appendChild(link);
          }

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.textContent = "ફેરફાર કરો";
          editBtn.addEventListener("click", () => {
            $("collection").value = collectionName;
            editingId = doc.id;
            $("title").value = item.title || "";
            $("content").value = item.content || "";
            $("imageUrl").value = item.imageUrl || "";
            $("linkUrl").value = item.linkUrl || "";
            renderMediaPreview($("imagePreview"), $("imageUrl").value, "image");
            renderMediaPreview($("linkPreview"), $("linkUrl").value, "link");
            $("date").value = item.date || "";
            $("location").value = item.location || "";
            $("published").checked = item.published === true;
            updateCollectionLabels();
            $("formHeading").textContent = collectionName === "contact" ? "સંપર્ક અને નકશામાં ફેરફાર કરો" : "સામગ્રીમાં ફેરફાર કરો";
            $("saveBtn").textContent = "ફેરફાર સાચવો";
            $("cancelEditBtn").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          article.appendChild(editBtn);

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "danger";
          deleteBtn.textContent = "કાઢી નાખો";
          deleteBtn.addEventListener("click", async () => {
            if (!confirm("આ સામગ્રી કાયમ માટે કાઢી નાખવી છે?")) return;
            try {
              await db.collection(collectionName).doc(doc.id).delete();
              setStatus("listStatus", "સામગ્રી કાઢી નાખી.");
              if (editingId === doc.id) resetForm();
              await loadItems();
            } catch (error) {
              console.error(error);
              setStatus("listStatus", "કાઢી શક્યા નહીં: " + error.code);
            }
          });
          article.appendChild(deleteBtn);

          $("contentList").appendChild(article);
        });
      } catch (error) {
        console.error(error);
        setStatus("listStatus", "સામગ્રી લોડ થઈ નહીં: " + error.code +
          ". Firestore Rules તપાસો.");
      }
    }
  </script>
</body>
</html>
