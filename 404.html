<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#741827">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>પેજ મળ્યું નથી | સધી સિકોતર માતાજી ઉદલપુરધામ</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: #410c19;
      background: #fff8e9;
      font-family: 'Noto Serif Gujarati', serif;
      text-align: center;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 52px);
      background: #fffdf7;
      border: 1px solid rgba(217,173,85,.8);
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(65,12,25,.10);
    }
    .om {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      color: #d9ad55;
      background: #741827;
      border: 3px solid #d9ad55;
      border-radius: 50%;
      font-size: 38px;
    }
    .code { margin: 0; color: #a47a31; font-size: 14px; letter-spacing: .16em; }
    h1 { margin: 10px 0 12px; font-size: clamp(25px, 6vw, 34px); }
    p { margin: 0 0 26px; line-height: 1.9; }
    a {
      display: inline-block;
      padding: 12px 24px;
      color: #fff8e9;
      background: #741827;
      border: 1px solid #d9ad55;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: #410c19; outline: 2px solid #d9ad55; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="om" aria-hidden="true">ૐ</div>
    <p class="code">ERROR 404</p>
    <h1>આ પેજ મળ્યું નથી</h1>
    <p>તમે શોધી રહ્યા છો તે પેજ ઉપલબ્ધ નથી અથવા તેનું સરનામું બદલાઈ ગયું હોઈ શકે છે.</p>
    <a href="./">મુખ્ય પેજ પર પાછા જાઓ</a>
  </main>
</body>
</html>
